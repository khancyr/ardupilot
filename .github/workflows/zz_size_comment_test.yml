name: zz size comment test

# THROWAWAY: isolates the "Post size table to PR" step from the
# size_sumarray branch so it can be tested without waiting on 11 board
# builds.  Delete this file and its branch when done.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  global-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Canned size summary
        run: |
          cat > /tmp/size-summary.md <<'EOF'
## Global Size Summary (Total Flash delta in bytes)

| Board | copter |
| :--- | :---: |
| Durandal | +99 |
EOF

      - name: Post size table to PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="<!-- size-table -->"
          { echo "$MARKER"; cat /tmp/size-summary.md; } > /tmp/full-comment.md
          PR=${{ github.event.pull_request.number }}
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
            --jq "[.[] | select(.body | startswith(\"${MARKER}\"))][0].id // empty")
          if [ -n "$EXISTING" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${EXISTING}" \
              -X PATCH --field body=@/tmp/full-comment.md
          else
            gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
              -X POST --field body=@/tmp/full-comment.md
          fi
